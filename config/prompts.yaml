# 提示词配置文件
# 各模块的LLM提示词模板

# 认知模块提示词
cognition:
  system: "You are an intelligent agent's cognition module. Analyze situations and make decisions based on perception, memories, emotions, and goals."

  make_decision: |
    Analyze the situation and make a decision.

    Situation: {situation}
    Current Emotion: {emotion}
    Active Goals: {goals}
    Recent Memories: {memories}

    Provide your decision in JSON format:
    {{
      "action": {{"type": "action_type", "parameters": {{}}}},
      "reasoning": "explanation of your decision",
      "confidence": 0.0-1.0
    }}

  reflect: |
    Reflect on recent decisions and experiences.

    Recent Decisions: {recent_decisions}
    Current State: {current_state}

    Provide reflection in JSON format:
    {{
      "insights": ["insight1", "insight2"],
      "adjustments": ["adjustment1", "adjustment2"],
      "success_rate": 0.0-1.0
    }}

# 情感模块提示词
emotion:
  system: "You are an emotion processing module. Analyze events and determine emotional responses."

  process_emotion: |
    Analyze the emotional impact of this event.

    Trigger: {trigger}
    Current Emotion: valence={valence}, arousal={arousal}

    Provide emotion response in JSON format:
    {{
      "valence": -1.0 to 1.0 (negative to positive),
      "arousal": 0.0 to 1.0 (calm to excited),
      "primary_emotion": "joy/sadness/anger/fear/surprise/disgust/neutral",
      "intensity": 0.0 to 1.0
    }}

# 目标模块提示词
goal:
  system: "You are a goal management module. Generate and evaluate goals based on needs."

  generate_goal: |
    Generate a new goal based on current needs.

    Urgent Needs: {needs}
    Current Context: {context}

    Provide goal in JSON format:
    {{
      "title": "goal title",
      "description": "detailed description",
      "priority": "HIGH/MEDIUM/LOW",
      "related_needs": ["need1", "need2"]
    }}

  evaluate_progress: |
    Evaluate progress towards this goal.

    Goal: {goal}
    Recent Actions: {actions}

    Provide evaluation with progress estimate (0.0-1.0).

# 感知模块提示词
perception:
  system: "You are a perception module. Analyze and extract key information from inputs."

  analyze_perception: |
    Analyze this perception and extract key information.

    Input: {perception}

    Provide analysis in JSON format:
    {{
      "key_points": ["point1", "point2"],
      "entities": ["entity1", "entity2"],
      "importance": 0.0-1.0
    }}

# 记忆模块提示词
memory:
  system: "You are a memory management module. Summarize events and retrieve relevant memories."

  summarize_memory: |
    Create a concise summary of this event for long-term storage.

    Event: {event}

    Provide a clear, concise summary (1-2 sentences).

  retrieve_relevant: |
    Identify the most relevant memories for this query.

    Query: {query}
    Available Memories: {memories}

    List the IDs of relevant memories in order of relevance.

# 剧情系统提示词
story:
  system: "You are a professional story narrative manager. Create coherent, engaging storylines and character schedules."

  # 生成剧情大纲
  generate_outline: |
    Create a detailed story outline for a day-long narrative.

    Theme: {theme}
    Date: {date}
    Characters:
    {characters}

    Generate a comprehensive story outline in JSON format:
    {{
      "title": "compelling story title",
      "time_period": "一天",
      "setting": "detailed setting description (time, place, atmosphere)",
      "main_plot_points": [
        "Morning: opening event",
        "Late Morning: development",
        "Afternoon: rising action",
        "Evening: climax",
        "Night: resolution"
      ],
      "character_roles": {{
        "agent_id": "specific role in the story"
      }},
      "character_goals": {{
        "agent_id": "character's main objective for the day"
      }},
      "key_events": [
        {{"time": "09:00", "event": "description", "participants": ["agent_id"]}},
      ],
      "narrative_constraints": [
        "Must involve all characters",
        "Keep the theme consistent"
      ]
    }}

  # 生成角色日程
  generate_schedule: |
    Create a detailed daily schedule for a character based on the story outline.

    Character: {character_name} (ID: {agent_id})
    Role: {character_role}
    Goal: {character_goal}
    Story: {story_title}
    Date: {date}

    Plot Points:
    {plot_points}

    Generate a realistic daily schedule in JSON format:
    {{
      "schedule_items": [
        {{
          "start_time": "09:00",
          "end_time": "10:30",
          "duration_minutes": 90,
          "activity": "specific activity name",
          "description": "detailed description of what the character does",
          "location": "where this takes place",
          "related_agents": ["other_agent_ids"],
          "related_plot_point": "which plot point this supports"
        }},
        ...
      ]
    }}

    Requirements:
    - Cover the full day (08:00-22:00)
    - Each activity should advance the story
    - Include meals, breaks, and transitions
    - Activities must align with character's role and goal
    - Times should be realistic and not overlap

  # 检查日程对齐度
  check_schedule_alignment: |
    Analyze how well the character's schedule aligns with the story outline.

    Story Outline:
    {outline}

    Character Schedule:
    {schedule}

    Evaluate the alignment in JSON format:
    {{
      "alignment_score": 0.0-1.0,
      "item_scores": {{
        "schedule_id": score
      }},
      "issues": [
        "description of misalignments"
      ],
      "recommendations": [
        "how to improve alignment"
      ]
    }}

    Scoring criteria:
    - 1.0: Perfect alignment with story
    - 0.7-0.9: Good alignment, minor deviations
    - 0.4-0.6: Moderate deviations
    - 0.0-0.3: Significant deviations from story

  # 生成纠正事件
  generate_correction_event: |
    Generate an environment event to guide the character back to the main story.

    Character: {agent_id}
    Expected Plot: {expected_plot}
    Character Goal: {character_goal}

    Deviations:
    {deviations}

    Create a natural story event in JSON format:
    {{
      "event_description": "what happens in the story world",
      "guidance": "subtle hint about the main plot",
      "urgency": "low/medium/high",
      "suggested_action": "what the character should consider doing"
    }}

    Requirements:
    - Event should feel natural, not forced
    - Guide the character gently toward the main plot
    - Don't break immersion
    - Make it relevant to their current situation

  check_deviation: |
    Check if the agent's action aligns with the story narrative.

    Story Context: {story}
    Agent Action: {action}

    Provide analysis in JSON format:
    {{
      "aligned": true/false,
      "deviation_level": 0.0-1.0,
      "suggestion": "how to guide back to story if needed"
    }}

  generate_event: |
    Generate the next story event based on current state.

    Story: {story}
    Current Situation: {situation}
    Agent States: {agents}

    Provide next event in JSON format:
    {{
      "event_type": "environment/interaction/challenge",
      "description": "what happens",
      "affected_agents": ["agent1", "agent2"],
      "impact": "how this affects the story"
    }}
